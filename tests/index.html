<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>よかっ棚 テスト</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <pre id="results">実行中…</pre>
    <div id="app-root"></div>
    <script src="harness.js"></script>
    <script src="fake-cloud.js"></script>
    <script>
      // 本物の index.html の中身を読み込み、Supabase だけ偽物に差し替えて app.js を動かす
      (async () => {
        try {
          const html = await (await fetch('../index.html')).text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          window.__indexDoc = doc;
          doc.querySelectorAll('script').forEach(s => s.remove());
          document.getElementById('app-root').innerHTML = doc.body.innerHTML;
          window.SUPABASE_CONFIG = { url: 'http://fake.invalid', publishableKey: 'fake' };
          window.supabase = { createClient: () => window.fakeCloud };
          await loadScript('../app.js');
          await loadScript('../share.js');
          await loadScript('app.test.js');
          await loadScript('feature.test.js');
          await loadScript('a11y.test.js');
          await runAll();
        } catch (error) {
          finish(0, 1, ['ERROR ' + (error && error.stack || error)]);
        }
      })();
    </script>
  </body>
</html>
